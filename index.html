<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cambio de Control · El siguiente nivel comienza fuera de la pantalla</title>
<meta name="description" content="Baraja física de retos para niños y niñas de 9 a 11 años. Misiones fuera de la pantalla para recuperar Terrabit, un videojuego que perdió su color.">
<meta name="theme-color" content="#1F1B2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. VARIABLES DE MARCA
   Cambia aquí los colores exactos del logo si difieren.
   ========================================================= */
:root{
  --fucsia:#FF2D8F;
  --naranja:#FF8A1F;
  --verde:#2ECC71;
  --azul:#1E90FF;
  --amarillo:#FFC93C;

  /* Versiones oscuras para TEXTO sobre fondo claro (cumplen contraste AA) */
  --verde-osc:#137A3E;
  --fucsia-osc:#B0125F;
  --azul-osc:#0B5CAD;
  --naranja-osc:#A34E00;

  --crema:#FFF8F0;
  --crema-2:#FBEBDC;
  --papel:#FFFFFF;
  --tinta:#1F1B2E;
  --tinta-2:#4A4560;
  --gris:#D9D4E7;

  --borde:3px;
  --sombra:5px;
  --radio:0px;
  --t:260ms;

  --f-pixel:"Silkscreen", "Courier New", monospace;
  --f-texto:"Nunito", "Trebuchet MS", system-ui, sans-serif;

  color-scheme: light;
}

/* =========================================================
   2. BASE
   ========================================================= */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;
  font-family:var(--f-texto);
  font-size:1.0625rem; /* 17px: nunca menos de 16px */
  line-height:1.55;
  color:var(--tinta);
  background-color:var(--crema);
  background-image:
    linear-gradient(rgba(31,27,46,.035) 2px, transparent 2px),
    linear-gradient(90deg, rgba(31,27,46,.035) 2px, transparent 2px);
  background-size:24px 24px;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{line-height:1.15;margin:0 0 .5em}
p{margin:0 0 1em}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.salto{position:absolute;left:12px;top:-60px;z-index:999;background:var(--tinta);color:#fff;padding:12px 16px;font-weight:800;text-decoration:none;transition:top var(--t)}
.salto:focus{top:12px}
:focus-visible{outline:4px solid var(--azul);outline-offset:3px}
.pixel{font-family:var(--f-pixel);letter-spacing:.02em;font-weight:400}
.pixelado{image-rendering:pixelated;image-rendering:crisp-edges}

/* =========================================================
   3. COMPONENTES COMUNES
   ========================================================= */
/* Botón tipo "botón de mando": se hunde al presionar */
.btn{
  --c:var(--amarillo);
  display:inline-flex;align-items:center;justify-content:center;gap:.6em;
  min-height:52px;padding:.7em 1.3em;
  font-family:var(--f-pixel);font-size:1rem;font-weight:700;letter-spacing:.03em;
  text-decoration:none;text-align:center;line-height:1.1;
  color:var(--tinta);background:var(--c);
  border:var(--borde) solid var(--tinta);
  box-shadow:0 var(--sombra) 0 var(--tinta), inset 0 -4px 0 rgba(0,0,0,.14), inset 0 3px 0 rgba(255,255,255,.45);
  cursor:pointer;user-select:none;
  transition:transform 90ms ease, box-shadow 90ms ease, filter var(--t);
  position:relative;
}
.btn:hover{filter:brightness(1.05)}
.btn:active,.btn.presionado{transform:translateY(var(--sombra));box-shadow:0 0 0 var(--tinta), inset 0 3px 0 rgba(0,0,0,.18)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn--fucsia{--c:var(--fucsia)}
.btn--naranja{--c:var(--naranja)}
.btn--verde{--c:var(--verde)}
.btn--azul{--c:var(--azul)}
.btn--blanco{--c:var(--papel)}
.btn--oscuro{--c:var(--tinta);color:#fff;box-shadow:0 var(--sombra) 0 #000, inset 0 -4px 0 rgba(0,0,0,.3)}
.btn--chico{min-height:44px;padding:.5em .9em;font-size:.9rem}
.btn--bloque{width:100%}

/* Caja pixelada con sombra sólida desplazada */
.caja{
  background:var(--papel);
  border:var(--borde) solid var(--tinta);
  box-shadow:var(--sombra) var(--sombra) 0 var(--tinta);
  position:relative;
}
/* Esquinas escalonadas */
.escalon{
  clip-path:polygon(0 8px,8px 8px,8px 0,calc(100% - 8px) 0,calc(100% - 8px) 8px,100% 8px,100% calc(100% - 8px),calc(100% - 8px) calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,8px calc(100% - 8px),0 calc(100% - 8px));
}
.chip{
  display:inline-flex;align-items:center;gap:.4em;
  font-family:var(--f-pixel);font-size:.8rem;font-weight:700;
  padding:.3em .7em;border:2px solid var(--tinta);background:var(--papel);line-height:1.2;
}
.icono{width:24px;height:24px;flex:none;display:inline-block}
.icono svg,.pix svg{width:100%;height:100%;display:block}

/* Colores por territorio */
.t-bosque{--tc:var(--verde);--tc-osc:var(--verde-osc)}
.t-jardin{--tc:var(--fucsia);--tc-osc:var(--fucsia-osc)}
.t-mar{--tc:var(--azul);--tc-osc:var(--azul-osc)}
.t-montana{--tc:var(--naranja);--tc-osc:var(--naranja-osc)}

/* Aviso flotante */
.aviso{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:300;
  background:var(--tinta);color:#fff;padding:14px 20px;border:3px solid #000;
  font-weight:800;box-shadow:5px 5px 0 rgba(0,0,0,.35);max-width:calc(100% - 32px);
  transition:transform var(--t) ease;
}
.aviso.visible{transform:translate(-50%,0)}

/* Ventana modal */
.velo{position:fixed;inset:0;background:rgba(31,27,46,.62);z-index:400;display:none;align-items:center;justify-content:center;padding:16px}
.velo.abierto{display:flex}
.modal{max-width:440px;width:100%;padding:24px;max-height:90vh;overflow:auto;animation:aparecer var(--t) ease}
.modal h2{font-family:var(--f-pixel);font-size:1.3rem}
@keyframes aparecer{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}

/* Lienzo de confeti */
#confeti{position:fixed;inset:0;pointer-events:none;z-index:500;width:100%;height:100%}

/* =========================================================
   4. LANDING (adultos)
   ========================================================= */
body.modo-app #landing{display:none}
body.modo-landing #app{display:none}

.contenedor{width:100%;max-width:1160px;margin:0 auto;padding:0 16px}
.barra{
  position:sticky;top:0;z-index:100;
  background:rgba(255,248,240,.94);backdrop-filter:blur(6px);
  border-bottom:3px solid var(--tinta);
}
.barra .contenedor{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;min-height:44px}
.logo img{height:46px;width:auto}
.logo-texto{font-family:var(--f-pixel);font-weight:700;line-height:.95;font-size:1rem}
.logo-texto span{display:block}
.logo-texto .de{font-size:.6rem;letter-spacing:.2em;color:var(--tinta-2)}
.logo .control-mini{width:46px;height:30px}
.menu{display:none;gap:4px}
.menu a{font-weight:800;text-decoration:none;padding:10px 12px;min-height:44px;display:inline-flex;align-items:center;border-bottom:3px solid transparent}
.menu a:hover{border-color:var(--fucsia)}
.btn-carrito .cuenta{background:var(--fucsia);color:var(--tinta);border:2px solid var(--tinta);min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:.8rem}
@media (min-width:960px){.menu{display:flex}}

.seccion{padding:72px 0}
.seccion--oscura{background:var(--tinta);color:#fff}
.seccion--crema2{background:var(--crema-2);border-top:3px solid var(--tinta);border-bottom:3px solid var(--tinta)}
.antetitulo{font-family:var(--f-pixel);font-weight:700;font-size:.9rem;color:var(--fucsia-osc);margin-bottom:.6em;display:block}
.seccion--oscura .antetitulo{color:var(--amarillo)}
.titulo{font-family:var(--f-pixel);font-weight:700;font-size:clamp(1.6rem,4.5vw,2.6rem);line-height:1.1;margin-bottom:.4em}
.entrada-sec{max-width:680px;font-size:1.15rem;color:var(--tinta-2)}
.seccion--oscura .entrada-sec{color:#E8E4F5}

/* Hero */
.hero{padding:40px 0 72px;overflow:hidden;position:relative}
.hero .contenedor{display:grid;gap:40px;align-items:center}
.hero h1{font-family:var(--f-texto);font-weight:900;font-size:clamp(1.9rem,5.4vw,3.3rem);line-height:1.08;letter-spacing:-.01em;margin-bottom:.5em}
.hero h1 mark{background:linear-gradient(transparent 58%, var(--amarillo) 58%);color:inherit;padding:0 .08em}
.subtitulo-hero{font-family:var(--f-pixel);font-weight:700;font-size:clamp(1.05rem,2.6vw,1.35rem);color:var(--tinta);display:inline-block;background:var(--papel);border:3px solid var(--tinta);padding:.45em .7em;box-shadow:4px 4px 0 var(--fucsia);margin-bottom:1.4em}
.hero .acciones{display:flex;flex-wrap:wrap;gap:16px;margin-top:8px}
.hero .nota{font-size:1rem;color:var(--tinta-2);margin-top:18px}
.abanico{position:relative;height:380px;max-width:460px;margin:0 auto;width:100%}
.abanico .carta-mini{position:absolute;left:50%;top:50%;transition:transform 400ms cubic-bezier(.2,.9,.3,1.3)}
.abanico .carta-mini:nth-child(1){transform:translate(-115%,-46%) rotate(-12deg)}
.abanico .carta-mini:nth-child(2){transform:translate(-50%,-56%) rotate(0deg);z-index:2}
.abanico .carta-mini:nth-child(3){transform:translate(15%,-46%) rotate(12deg)}
.abanico:hover .carta-mini:nth-child(1){transform:translate(-125%,-48%) rotate(-16deg)}
.abanico:hover .carta-mini:nth-child(3){transform:translate(25%,-48%) rotate(16deg)}
.flotante{position:absolute;width:76px;animation:flotar 4s ease-in-out infinite}
.flotante.f1{left:0;bottom:6px}
.flotante.f2{right:0;top:0;animation-delay:-2s}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (max-width:520px){.abanico{height:300px}.abanico .carta-mini{width:138px}.flotante{width:58px}}
@media (min-width:900px){.hero .contenedor{grid-template-columns:1.1fr .9fr}.hero{padding:64px 0 96px}}

/* Carta en miniatura (imita la baraja física) */
.carta-mini{
  --tc:var(--verde);
  width:170px;aspect-ratio:5/8;background:var(--tc);
  border:3px solid var(--tinta);box-shadow:5px 5px 0 var(--tinta);
  padding:8px;display:flex;flex-direction:column;gap:6px;
  background-image:linear-gradient(rgba(255,255,255,.12) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.12) 75%,transparent 75%);
  background-size:16px 16px;
}
.carta-mini .cab{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-pixel);font-weight:700;font-size:.62rem;color:var(--tinta)}
.carta-mini .cab b{background:var(--papel);border:2px solid var(--tinta);padding:1px 4px}
.carta-mini .disco{background:rgba(255,255,255,.35);border-radius:50%;width:74%;aspect-ratio:1;margin:4px auto;display:grid;place-items:center}
.carta-mini .disco img{width:82%}
.carta-mini .nom{font-family:var(--f-pixel);font-weight:700;color:var(--tinta);text-align:center;font-size:.78rem;background:rgba(255,255,255,.75);padding:2px}
.carta-mini .cuerpo{background:var(--papel);border:2px solid var(--tinta);flex:1;padding:6px;font-size:.7rem;line-height:1.3}
.carta-mini .cuerpo p{margin:0 0 3px}

/* Datos de la encuesta */
.datos{display:grid;gap:20px;margin-top:36px}
.dato{padding:26px 22px}
.dato .num{font-family:var(--f-pixel);font-weight:700;font-size:clamp(3rem,10vw,4.4rem);line-height:1;color:var(--tinta)}
.dato .num small{font-size:.5em}
.dato p{font-size:1.15rem;font-weight:700;margin:.4em 0 1em}
.barra-pixel{height:22px;border:3px solid var(--tinta);background:var(--papel);position:relative;overflow:hidden}
.barra-pixel i{position:absolute;inset:0 auto 0 0;width:0;background:var(--c);transition:width 1100ms steps(14)}
.barra-pixel.llena i{width:var(--v)}
.dato:nth-child(1){--c:var(--verde)}
.dato:nth-child(2){--c:var(--fucsia)}
.dato:nth-child(3){--c:var(--azul)}
.dato .fuente{font-size:1rem;color:var(--tinta-2);font-weight:600;margin:12px 0 0}
.conclusion{margin-top:36px;padding:22px;border-left:8px solid var(--naranja);background:var(--papel);font-size:1.2rem;font-weight:700;max-width:820px}
@media (min-width:760px){.datos{grid-template-columns:repeat(3,1fr)}}

/* Pasos */
.pasos{display:grid;gap:24px;margin-top:40px;counter-reset:paso}
.paso{padding:24px 20px 22px;position:relative}
.paso .n{position:absolute;top:-18px;left:16px;width:40px;height:40px;display:grid;place-items:center;font-family:var(--f-pixel);font-weight:700;font-size:1.2rem;background:var(--amarillo);border:3px solid var(--tinta)}
.paso h3{font-family:var(--f-pixel);font-size:1.1rem;margin-top:14px}
.paso p{margin:0;color:var(--tinta-2)}
.paso .ilus{height:86px;display:flex;align-items:center;margin-top:10px}
.paso .ilus img{height:78px;width:auto}
.paso .ilus .icono{width:64px;height:64px}
.logo.con-logo .control-mini,.logo.con-logo .logo-texto{display:none}
@media (min-width:640px){.pasos{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.pasos{grid-template-columns:repeat(4,1fr)}}

/* Palos */
.palos{display:grid;gap:20px;margin-top:36px}
.palo{padding:22px;border-top:12px solid var(--c)}
.palo .cab{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.palo .cab .icono{width:40px;height:40px}
.palo h3{font-family:var(--f-pixel);font-size:1.35rem;margin:0}
.palo .ejemplo{margin-top:14px;background:var(--crema);border:2px dashed var(--tinta);padding:12px 14px}
.palo .ejemplo b{font-family:var(--f-pixel);font-size:.95rem;display:block;margin-bottom:2px}
.palo .ejemplo span{font-size:1rem;color:var(--tinta-2)}
@media (min-width:700px){.palos{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.palos{grid-template-columns:repeat(4,1fr)}}

/* Territorios y guías */
.territorios{display:grid;gap:22px;margin-top:36px}
.territorio{background:var(--tc);padding:18px;color:var(--tinta)}
.territorio .retrato{background:rgba(255,255,255,.4);border:3px solid var(--tinta);height:170px;display:grid;place-items:center;margin-bottom:14px;overflow:hidden}
.territorio .retrato img{height:140px;width:auto;transition:transform var(--t)}
.territorio:hover .retrato img{transform:translateY(-6px) scale(1.04)}
.territorio .lugar{font-family:var(--f-pixel);font-weight:700;font-size:.85rem;background:var(--tinta);color:#fff;display:inline-block;padding:2px 8px}
.territorio h3{font-family:var(--f-pixel);font-size:1.6rem;margin:.3em 0 .1em}
.territorio .quien{font-weight:800;margin-bottom:.6em}
.territorio .frase{background:var(--papel);border:3px solid var(--tinta);padding:10px 12px;font-weight:700;margin:0;position:relative}
.territorio .frase::before{content:"";position:absolute;top:-12px;left:22px;border:6px solid transparent;border-bottom-color:var(--tinta);border-width:0 8px 10px}
@media (min-width:700px){.territorios{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.territorios{grid-template-columns:repeat(4,1fr)}}

/* Productos */
.productos{display:grid;gap:28px;margin-top:40px;align-items:stretch}
.producto{display:flex;flex-direction:column;padding:0;overflow:visible}
.producto .foto{position:relative;height:230px;background:var(--crema-2);border-bottom:3px solid var(--tinta);display:grid;place-items:center;overflow:hidden}
.producto .foto>img.real{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.producto .info{padding:20px;display:flex;flex-direction:column;flex:1}
.producto h3{font-family:var(--f-pixel);font-size:1.25rem}
.producto ul{margin:0 0 16px;padding-left:1.1em;color:var(--tinta-2)}
.producto li{margin-bottom:4px}
.producto .precio{font-family:var(--f-pixel);font-weight:700;font-size:1.7rem;margin:auto 0 4px}
.producto .antes{text-decoration:line-through;color:var(--tinta-2);font-size:1rem;margin-bottom:12px;min-height:1.5em}
.producto--destacado{transform:translateY(-6px);box-shadow:var(--sombra) var(--sombra) 0 var(--fucsia), calc(var(--sombra) + 3px) calc(var(--sombra) + 3px) 0 var(--tinta)}
.etiqueta{position:absolute;top:-16px;right:16px;z-index:5;background:var(--fucsia);border:3px solid var(--tinta);font-family:var(--f-pixel);font-weight:700;font-size:.85rem;padding:4px 10px;transform:rotate(3deg)}
.nota-precios{margin-top:28px;font-size:1rem;color:var(--tinta-2)}
@media (min-width:900px){.productos{grid-template-columns:repeat(3,1fr)}}

/* Maquetas de producto (se ven si no hay foto real) */
.maq-baraja{position:relative;width:200px;height:190px}
.maq-baraja .carta-mini{position:absolute;width:104px;padding:5px;gap:4px;box-shadow:3px 3px 0 var(--tinta)}
.maq-baraja .carta-mini .cuerpo{display:none}
.maq-baraja .carta-mini:nth-child(1){left:0;top:24px;transform:rotate(-10deg)}
.maq-baraja .carta-mini:nth-child(2){left:48px;top:6px;z-index:2}
.maq-baraja .carta-mini:nth-child(3){left:96px;top:24px;transform:rotate(10deg)}
.maq-cuaderno{width:190px;height:170px;background:#3C8D5A;border:3px solid var(--tinta);box-shadow:4px 4px 0 var(--tinta);position:relative;padding:14px 14px 14px 26px}
.maq-cuaderno::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:6px;background:repeating-linear-gradient(var(--tinta) 0 6px,transparent 6px 14px)}
.maq-cuaderno .hoja{background:#F1EDE4;border:2px solid var(--tinta);height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px}
.maq-cuaderno .hoja img{width:100%;height:auto;align-self:center}
.maq-cuaderno .hoja img.gris{filter:grayscale(1) opacity(.35)}
.maq-pack{display:flex;align-items:center;gap:0}
.maq-pack .maq-baraja{transform:scale(.72);margin-right:-50px}
.maq-pack .maq-cuaderno{transform:scale(.78) rotate(4deg)}

/* Familias y docentes */
.familias{display:grid;gap:28px;margin-top:36px;align-items:start}
.familia-col{padding:24px;color:var(--tinta)}
.familia-col h3{font-family:var(--f-pixel);font-size:1.3rem}
.familia-col ul{margin:0;padding:0;list-style:none}
.familia-col li{padding:10px 0 10px 34px;position:relative;border-bottom:2px dashed rgba(31,27,46,.2)}
.familia-col li:last-child{border-bottom:0}
.familia-col li::before{content:"";position:absolute;left:4px;top:16px;width:14px;height:14px;background:var(--c,var(--verde));border:2px solid var(--tinta)}
.intercambio{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-top:32px;max-width:760px}
.intercambio .lado{background:var(--papel);color:var(--tinta);border:3px solid #000;padding:16px;text-align:center;font-weight:800}
.intercambio .lado b{display:block;font-family:var(--f-pixel);font-size:1rem;margin-bottom:4px}
.intercambio .flechas{font-family:var(--f-pixel);font-size:1.6rem;color:var(--amarillo)}
.lema{margin-top:40px;background:var(--amarillo);color:var(--tinta);border:3px solid #000;box-shadow:6px 6px 0 #000;padding:22px 24px;font-family:var(--f-pixel);font-weight:700;font-size:clamp(1.2rem,3.4vw,1.8rem);text-align:center}
@media (min-width:860px){.familias{grid-template-columns:1fr 1fr}}

/* Preguntas frecuentes (acordeón nativo) */
.faq{max-width:820px;margin-top:32px;display:grid;gap:16px}
.faq details{background:var(--papel);border:3px solid var(--tinta);box-shadow:4px 4px 0 var(--tinta)}
.faq summary{cursor:pointer;list-style:none;padding:18px 56px 18px 20px;font-weight:900;font-size:1.12rem;position:relative;min-height:44px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);width:30px;height:30px;display:grid;place-items:center;font-family:var(--f-pixel);font-weight:700;background:var(--amarillo);border:2px solid var(--tinta);transition:transform var(--t)}
.faq details[open] summary::after{content:"–";background:var(--verde)}
.faq .resp{padding:0 20px 18px;color:var(--tinta-2)}
.faq .resp p:last-child{margin:0}

/* Pie */
.pie-sitio{background:var(--tinta);color:#E8E4F5;padding:48px 0 32px;border-top:6px solid var(--fucsia)}
.pie-sitio .contenedor{display:grid;gap:28px}
.pie-sitio h3{font-family:var(--f-pixel);color:#fff;font-size:1.1rem}
.pie-sitio a{color:#fff;font-weight:800;display:inline-flex;min-height:44px;align-items:center}
.pie-sitio .franja{display:flex;gap:6px;margin-top:10px}
.pie-sitio .franja i{width:22px;height:10px;display:block}
.pie-sitio .legal{font-size:1rem;color:#B9B3CF;border-top:2px solid #3A3550;padding-top:18px;grid-column:1/-1}
@media (min-width:760px){.pie-sitio .contenedor{grid-template-columns:1.4fr 1fr 1fr}}

/* Carrito (panel lateral) */
.carrito{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--crema);border-left:4px solid var(--tinta);z-index:450;transform:translateX(105%);transition:transform 300ms ease;display:flex;flex-direction:column}
.carrito.abierto{transform:none}
.carrito header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:3px solid var(--tinta);background:var(--amarillo)}
.carrito header h2{font-family:var(--f-pixel);font-size:1.3rem;margin:0}
.carrito .lista{flex:1;overflow:auto;padding:16px;display:grid;gap:14px;align-content:start}
.item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:14px;background:var(--papel);border:3px solid var(--tinta)}
.item h3{font-size:1.05rem;margin:0}
.item .sub{color:var(--tinta-2);font-weight:700}
.cantidad{display:flex;align-items:center;gap:6px;margin-top:8px}
.cantidad button{width:44px;height:44px;border:3px solid var(--tinta);background:var(--papel);font-family:var(--f-pixel);font-weight:700;font-size:1.2rem;cursor:pointer}
.cantidad button:active{transform:translateY(2px)}
.cantidad output{min-width:32px;text-align:center;font-weight:900;font-size:1.1rem}
.quitar{background:none;border:0;text-decoration:underline;font-weight:800;color:var(--fucsia-osc);cursor:pointer;min-height:44px;padding:0 4px;align-self:start}
.carrito footer{padding:16px;border-top:3px solid var(--tinta);background:var(--papel);display:grid;gap:12px}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-pixel);font-weight:700;font-size:1.3rem}
.vacio{text-align:center;padding:32px 8px;color:var(--tinta-2)}
.vacio img{width:90px;margin:0 auto 12px}

/* =========================================================
   5. PROTOTIPO PARA NIÑOS (Terrabit)
   ========================================================= */
body.modo-app{background-color:#2A2440;background-image:
  radial-gradient(#3B3459 2px,transparent 2px);background-size:22px 22px}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--crema);display:flex;flex-direction:column;position:relative;
  background-image:linear-gradient(rgba(31,27,46,.04) 2px,transparent 2px),linear-gradient(90deg,rgba(31,27,46,.04) 2px,transparent 2px);background-size:20px 20px}
@media (min-width:560px){#app{border-left:4px solid #000;border-right:4px solid #000;box-shadow:0 0 0 6px #4A4166}}
.app-cab{position:sticky;top:0;z-index:50;background:var(--tinta);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:4px solid #000}
.app-cab .marca{font-family:var(--f-pixel);font-weight:700;font-size:1.05rem;text-decoration:none;display:flex;align-items:center;gap:8px;min-height:44px;color:#fff}
.app-cab .marca .franja{display:flex;gap:2px}
.app-cab .marca .franja i{width:8px;height:14px;display:block}
.btn-sonido{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:6px 12px;background:#3A3450;color:#fff;border:2px solid #fff;cursor:pointer;font-family:var(--f-pixel);font-weight:700;font-size:.85rem}
.btn-sonido .icono{width:22px;height:22px}
.btn-sonido[aria-pressed="false"]{background:#000;border-color:#888}
.app-cuerpo{flex:1;padding:20px 16px 112px}
.pantalla{animation:entrarPantalla 320ms ease}
@keyframes entrarPantalla{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pantalla h1{font-family:var(--f-pixel);font-weight:700;font-size:clamp(1.55rem,6vw,2rem);line-height:1.1;outline:none}
.lead{font-size:1.15rem;font-weight:700}
.nav-app{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:60;background:var(--tinta);border-top:4px solid #000;display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav-app a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;color:#fff;text-decoration:none;font-family:var(--f-pixel);font-size:.72rem;font-weight:700;border-top:4px solid transparent;margin-top:-4px}
.nav-app a .icono{width:26px;height:26px}
.nav-app a[aria-current="page"]{background:#3A3450;border-top-color:var(--amarillo);color:var(--amarillo)}

/* Banner "vuelve a la baraja" */
.vuelve{margin-top:28px;display:flex;gap:14px;align-items:center;padding:14px 16px;background:var(--amarillo);border:3px solid var(--tinta);box-shadow:4px 4px 0 var(--tinta)}
.vuelve .icono-carta{flex:none;width:38px;height:52px;background:var(--tinta);border:3px solid var(--tinta);position:relative;transform:rotate(-8deg)}
.vuelve .icono-carta::after{content:"";position:absolute;inset:4px;border:2px solid var(--amarillo)}
.vuelve p{margin:0;font-weight:900;font-size:1.05rem;line-height:1.3}

/* Entrada */
.bienvenida{text-align:center;padding-top:6px}
.bienvenida .guias{display:flex;justify-content:center;gap:4px;margin:6px 0 10px}
.bienvenida .guias img{width:68px;height:68px;object-fit:contain;animation:saltito 2.4s ease-in-out infinite}
.bienvenida .guias img:nth-child(2){animation-delay:-.6s}
.bienvenida .guias img:nth-child(3){animation-delay:-1.2s}
.bienvenida .guias img:nth-child(4){animation-delay:-1.8s}
@keyframes saltito{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.afuera{margin:18px 0;padding:18px;text-align:left;display:flex;gap:14px;align-items:flex-start}
.afuera .icono{width:44px;height:44px}
.afuera p{margin:0}
.botonera{display:grid;gap:16px;margin-top:20px}
.codigo{display:flex;gap:10px;margin-top:8px}
.codigo input{flex:1;min-width:0;min-height:52px;border:3px solid var(--tinta);padding:0 14px;font-family:var(--f-pixel);font-size:1rem;text-transform:uppercase;background:var(--papel)}
.mensaje-form{min-height:1.5em;font-weight:800;margin-top:8px}
.mensaje-form.error{color:var(--fucsia-osc)}
.enlace-adulto{display:block;text-align:center;margin-top:22px;font-weight:800;min-height:44px;line-height:44px}

/* Mapa */
.mapa{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;position:relative}
.terr{
  position:relative;aspect-ratio:1/1.08;border:4px solid var(--tinta);cursor:pointer;padding:0;overflow:hidden;
  background:var(--tc);text-align:left;box-shadow:4px 4px 0 var(--tinta);
  filter:grayscale(var(--gris,1)) brightness(var(--brillo,1));
  transition:filter 900ms ease, transform 120ms ease;
}
.terr:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--tinta)}
.terr .paisaje{position:absolute;inset:0}
.terr .nombre{position:absolute;left:8px;top:8px;z-index:3;font-family:var(--f-pixel);font-weight:700;font-size:.95rem;background:var(--papel);border:2px solid var(--tinta);padding:2px 8px}
.terr .estado{position:absolute;left:8px;bottom:8px;z-index:3;font-weight:900;font-size:.9rem;background:var(--tinta);color:#fff;padding:2px 8px}
.terr .guia-img{position:absolute;right:4px;bottom:24px;width:46%;z-index:2;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.35))}
.terr.encendido{animation:encender 900ms steps(6)}
@keyframes encender{0%{filter:grayscale(1) brightness(1.6)}50%{filter:grayscale(.3) brightness(1.4)}100%{filter:grayscale(var(--gris)) brightness(1)}}
.centro-control{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:12px 14px;margin-top:4px}
.centro-control .control{width:96px;flex:none}
.centro-control p{margin:0;font-weight:700}

/* Paisajes por territorio (decorados en CSS) */
.paisaje.bosque{background:linear-gradient(#BDF2D2 0 45%,#7FD9A0 45% 62%,#2E9E5B 62% 100%)}
.paisaje.jardin{background:linear-gradient(#FFD6EC 0 50%,#FF8CC4 50% 64%,#5BBF6B 64% 100%)}
.paisaje.mar{background:linear-gradient(#BFE3FF 0 38%,#5BB2FF 38% 46%,#1E90FF 46% 70%,#0E6ACB 70% 100%)}
.paisaje.montana{background:linear-gradient(#FFE0B8 0 45%,#FFB066 45% 70%,#C9762A 70% 100%)}
.paisaje .deco{position:absolute;image-rendering:pixelated}
.olas{position:absolute;left:0;right:0;height:8px;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 24px);opacity:.7}

/* Hoja de territorio (panel) */
.hoja-terr{margin-top:6px}
.hoja-terr .cab-terr{background:var(--tc);border:3px solid var(--tinta);padding:14px;display:flex;gap:12px;align-items:center}
.hoja-terr .cab-terr img{width:72px;height:72px;object-fit:contain;flex:none}
.hoja-terr .cab-terr h2{font-family:var(--f-pixel);margin:0;font-size:1.3rem}
.hoja-terr .cab-terr p{margin:0;font-weight:700}
.especies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.esp{border:3px solid var(--tinta);background:var(--papel);padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;text-align:center;font-weight:800;font-size:.9rem;line-height:1.15;box-shadow:3px 3px 0 var(--tinta)}
.esp:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--tinta)}
.esp img{width:62px;height:62px;object-fit:contain}
.esp.bloqueada img{filter:brightness(0) opacity(.22)}
.esp.bloqueada{background:var(--crema-2)}
.esp .num{font-family:var(--f-pixel);font-size:.72rem;color:var(--tinta-2)}
.misiones-lista{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.misiones-lista li{display:flex;align-items:center;gap:10px;background:var(--papel);border:2px solid var(--tinta);padding:8px 10px;font-weight:800}
.misiones-lista li .icono{width:24px;height:24px}
.misiones-lista li small{margin-left:auto;font-weight:700;color:var(--tinta-2);font-size:.85rem;text-align:right}

/* Escena (pieza audiovisual) */
.etapa{position:relative;aspect-ratio:4/3.3;border:4px solid var(--tinta);overflow:hidden;background:var(--tc);box-shadow:5px 5px 0 var(--tinta);margin-top:10px}
.etapa .paisaje,.etapa .nube{filter:grayscale(1);transition:filter 2800ms steps(10)}
.etapa.coloreada .paisaje,.etapa.coloreada .nube{filter:grayscale(0)}
.etapa .paisaje{position:absolute;inset:0}
.actor{position:absolute;width:40%;left:30%;bottom:16%;z-index:3;image-rendering:pixelated;filter:grayscale(1) drop-shadow(4px 4px 0 rgba(0,0,0,.25));opacity:0;transition:filter 2800ms steps(10)}
.etapa.coloreada .actor{filter:grayscale(0) drop-shadow(4px 4px 0 rgba(0,0,0,.25))}
.etapa.reproduciendo .actor{opacity:1}
.etapa.reproduciendo .mov-camina{animation:camina 5.5s steps(22) forwards}
.etapa.reproduciendo .mov-vuela{animation:vuela 5.5s ease-in-out forwards}
.etapa.reproduciendo .mov-nada{animation:nada 5.5s ease-in-out forwards}
.etapa.reproduciendo .mov-crece{animation:crece 5.5s steps(30) forwards}
.etapa.reproduciendo .mov-planea{animation:planea 5.5s ease-in-out forwards}
.etapa.reproduciendo .mov-zumba{animation:zumba 5.5s linear forwards}
@keyframes camina{0%{transform:translateX(-150%)}10%{transform:translate(-120%,-4%)}20%{transform:translateX(-95%)}30%{transform:translate(-70%,-4%)}40%{transform:translateX(-45%)}50%{transform:translate(-20%,-4%)}60%,100%{transform:translateX(0)}}
@keyframes vuela{0%{transform:translate(-170%,40%) rotate(-8deg)}25%{transform:translate(-60%,-30%) rotate(4deg)}45%{transform:translate(40%,10%) rotate(-4deg)}60%{transform:translate(0,-20%)}70%,100%{transform:translate(0,-12%)}}
@keyframes nada{0%{transform:translate(160%,10%)}35%{transform:translate(40%,-10%)}60%{transform:translate(0,6%)}80%,100%{transform:translate(0,0)}}
@keyframes crece{0%{transform:scale(.05);transform-origin:50% 100%}50%{transform:scale(1.08);transform-origin:50% 100%}60%,100%{transform:scale(1);transform-origin:50% 100%}}
@keyframes planea{0%{transform:translate(-160%,-60%) scale(.6) rotate(-10deg)}45%{transform:translate(30%,-40%) scale(.9) rotate(8deg)}70%,100%{transform:translate(0,-25%) scale(1) rotate(0)}}
@keyframes zumba{0%{transform:translate(-150%,0)}10%{transform:translate(-110%,-20%)}20%{transform:translate(-80%,10%)}30%{transform:translate(-40%,-25%)}40%{transform:translate(-10%,15%)}50%{transform:translate(20%,-10%)}60%,100%{transform:translate(0,-6%)}}
.burbuja-aire{position:absolute;width:10px;height:10px;border:2px solid #fff;z-index:2;opacity:0}
.etapa.reproduciendo .burbuja-aire{animation:subir 3.6s steps(12) infinite}
@keyframes subir{0%{transform:translateY(0);opacity:0}15%{opacity:.9}100%{transform:translateY(-220px);opacity:0}}
.nube{position:absolute;width:12px;height:12px;background:#fff;z-index:1;box-shadow:12px 0 #fff,24px 0 #fff,6px -10px #fff,18px -10px #fff;opacity:.9}
.etapa.reproduciendo .nube{animation:deriva 8s linear infinite}
@keyframes deriva{from{transform:translateX(0)}to{transform:translateX(60px)}}
.chispas{position:absolute;inset:0;z-index:4;pointer-events:none}
.chispas i{position:absolute;width:8px;height:8px;background:#fff;opacity:0}
.etapa.terminada .chispas i{animation:chispa 900ms steps(4) forwards}
@keyframes chispa{0%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.6) translateY(-14px)}}

.guia-escena{position:absolute;left:8px;top:8px;right:8px;z-index:5;display:flex;align-items:flex-start;gap:6px;opacity:0;transform:translateY(-8px);transition:opacity var(--t),transform var(--t)}
.guia-escena.visible{opacity:1;transform:none}
.guia-escena img{width:58px;height:58px;object-fit:contain;flex:none;background:var(--papel);border:3px solid var(--tinta)}
.globo{background:var(--papel);border:3px solid var(--tinta);padding:8px 10px;font-weight:800;font-size:1rem;line-height:1.3;position:relative;min-height:46px;flex:1}
.globo::before{content:"";position:absolute;left:-11px;top:14px;border-style:solid;border-width:6px 10px 6px 0;border-color:transparent var(--tinta) transparent transparent}
.globo b{font-family:var(--f-pixel);display:block;font-size:.8rem;color:var(--tc-osc)}
.btn-play{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);z-index:6}
.btn-play:active{transform:translate(-50%,calc(-50% + 5px))}
.etapa.reproduciendo .btn-play,.etapa.terminada .btn-play{display:none}
.ficha-escena{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.acciones-escena{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}

/* Historia */
.historia-cab{display:flex;gap:14px;align-items:center;padding:14px;background:var(--tc)}
.historia-cab img{width:110px;height:110px;object-fit:contain;flex:none;filter:drop-shadow(3px 3px 0 rgba(0,0,0,.3))}
.historia-cab h1{margin:0 0 6px}
.historia-texto{font-size:1.15rem;margin-top:18px}
.curioso{padding:16px;margin-top:6px;border-left:10px solid var(--tc)}
.curioso h2{font-family:var(--f-pixel);font-size:1rem;margin-bottom:6px}
.curioso p{margin:0;font-weight:700}

/* Selector de especies */
.selector{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}

/* Glitch */
.glitch-zona{background:#0E0B19;color:#fff;border:4px solid #000;padding:20px 16px;position:relative;overflow:hidden;box-shadow:5px 5px 0 var(--tinta)}
.glitch-zona::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(rgba(255,255,255,.05) 0 2px,transparent 2px 4px);z-index:1}
.glitch-zona>*{position:relative;z-index:2}
.glitch-titulo{font-family:var(--f-pixel);font-weight:700;font-size:clamp(2.2rem,11vw,3.2rem);line-height:1;text-align:center;margin:6px 0 4px;position:relative;
  text-shadow:3px 0 #FF2D8F,-3px 0 #00E5FF;animation:parpadeo 3.2s steps(1) infinite}
.glitch-titulo::before,.glitch-titulo::after{content:attr(data-texto);position:absolute;left:0;right:0;top:0;overflow:hidden}
.glitch-titulo::before{color:#FF2D8F;clip-path:inset(0 0 60% 0);transform:translateX(-4px);animation:corte1 2.4s steps(2) infinite}
.glitch-titulo::after{color:#00E5FF;clip-path:inset(55% 0 0 0);transform:translateX(4px);animation:corte2 1.9s steps(2) infinite}
@keyframes parpadeo{0%,92%,100%{opacity:1}93%{opacity:.3}95%{opacity:1}97%{opacity:.5}}
@keyframes corte1{0%{clip-path:inset(0 0 60% 0);transform:translateX(-4px)}50%{clip-path:inset(30% 0 40% 0);transform:translateX(5px)}100%{clip-path:inset(70% 0 5% 0);transform:translateX(-2px)}}
@keyframes corte2{0%{clip-path:inset(55% 0 0 0);transform:translateX(4px)}50%{clip-path:inset(10% 0 70% 0);transform:translateX(-5px)}100%{clip-path:inset(40% 0 35% 0);transform:translateX(3px)}}
.glitch-zona .senal{text-align:center;font-family:var(--f-pixel);color:#9AE6FF;margin-bottom:14px}
.acertijos{display:grid;gap:12px;margin-top:16px}
.acertijo{background:#1C1730;border:3px solid var(--tc);padding:14px}
.acertijo h3{font-family:var(--f-pixel);font-size:1rem;color:var(--tc);margin:0 0 6px;filter:brightness(1.25)}
.acertijo p{font-weight:700;margin-bottom:10px}
.acertijo .codigo input{background:#0E0B19;color:#fff;border-color:#fff}
.acertijo.resuelto{border-style:solid;background:#221B3A}
.secreto{margin-top:12px;background:var(--papel);color:var(--tinta);border:3px solid var(--tc);padding:14px;animation:revelar 700ms steps(7)}
.secreto h4{font-family:var(--f-pixel);font-size:1rem;margin-bottom:6px}
.secreto p{margin:0 0 8px}
.secreto .reto-extra{background:var(--amarillo);border:2px solid var(--tinta);padding:8px 10px;font-weight:800;margin:0}
@keyframes revelar{0%{clip-path:inset(0 100% 0 0);filter:hue-rotate(90deg)}60%{filter:hue-rotate(-60deg)}100%{clip-path:inset(0 0 0 0);filter:none}}
.glitch-sacudida{animation:sacudir 420ms steps(6)}
@keyframes sacudir{0%{transform:translate(0)}20%{transform:translate(-6px,2px);filter:hue-rotate(80deg)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,1px);filter:invert(1)}80%{transform:translate(4px,0)}100%{transform:none;filter:none}}

/* Colección */
.bloque-col{margin-top:22px}
.bloque-col h2{font-family:var(--f-pixel);font-size:1.15rem;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.control-grande{padding:16px;text-align:center}
.control-grande .control{width:min(280px,80%);margin:0 auto}
.control .frag{transition:transform 700ms cubic-bezier(.3,1.4,.4,1),opacity 500ms}
.control.roto .f0{transform:translate(-1.2px,-1.2px)}
.control.roto .f1{transform:translate(1.2px,-1.2px)}
.control.roto .f2{transform:translate(-1.2px,1.2px)}
.control.roto .f3{transform:translate(1.2px,1.2px)}
.fragmentos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.frag-btn{display:flex;align-items:center;gap:10px;padding:10px;border:3px solid var(--tinta);background:var(--papel);cursor:pointer;text-align:left;font-weight:800;min-height:56px;box-shadow:3px 3px 0 var(--tinta)}
.frag-btn .cuadro{width:26px;height:26px;border:3px solid var(--tinta);background:var(--gris);flex:none}
.frag-btn[aria-pressed="true"]{background:var(--tc)}
.frag-btn[aria-pressed="true"] .cuadro{background:var(--tinta)}
.frag-btn small{display:block;font-weight:700;font-size:.85rem}
.insignias{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.insignia{text-align:center;padding:10px 6px;border:3px solid var(--tinta);background:var(--papel);font-weight:800;font-size:.88rem;line-height:1.2}
.insignia .medalla{width:52px;height:52px;margin:0 auto 6px}
.insignia.apagada{background:var(--crema-2);color:var(--tinta-2)}
.insignia.apagada .medalla{filter:grayscale(1) opacity(.35)}
.insignia small{display:block;font-weight:600;font-size:.8rem;margin-top:3px}
.juegos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.juego-btn{min-height:52px;padding:8px 10px;border:3px solid var(--tinta);background:var(--papel);font-weight:800;cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px;box-shadow:3px 3px 0 var(--tinta)}
.juego-btn[aria-pressed="true"]{background:var(--amarillo)}
.juego-btn .check{width:22px;height:22px;border:3px solid var(--tinta);background:var(--papel);flex:none;display:grid;place-items:center;font-family:var(--f-pixel);font-size:.8rem}
.juego-btn[aria-pressed="true"] .check{background:var(--tinta);color:var(--amarillo)}
.texto-suave{color:var(--tinta-2);font-weight:600}
.borrar{background:none;border:0;color:var(--fucsia-osc);text-decoration:underline;font-weight:800;min-height:44px;cursor:pointer;margin-top:20px}

/* Mis retos */
.form-reto{padding:18px;margin-top:14px;background:var(--amarillo)}
.campo{margin-bottom:14px}
.campo label,.campo legend{display:block;font-family:var(--f-pixel);font-weight:700;font-size:.92rem;margin-bottom:6px}
.campo input[type=text],.campo textarea{width:100%;min-height:50px;border:3px solid var(--tinta);background:var(--papel);padding:10px 12px;font-size:1.05rem}
.campo textarea{min-height:90px;resize:vertical}
fieldset.campo{border:0;padding:0;margin:0 0 14px}
.opciones{display:flex;flex-wrap:wrap;gap:8px}
.opcion{position:relative}
.opcion input{position:absolute;opacity:0;width:1px;height:1px}
.opcion span{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:6px 12px;border:3px solid var(--tinta);background:var(--papel);font-weight:800;cursor:pointer}
.opcion input:checked+span{background:var(--tc,var(--tinta));color:var(--tinta);box-shadow:inset 0 0 0 3px var(--papel)}
.opcion input:focus-visible+span{outline:4px solid var(--azul);outline-offset:2px}
.opcion .bolita{width:16px;height:16px;border:2px solid var(--tinta);background:var(--tc)}
.palo-op input:checked+span{background:var(--tinta);color:#fff}
.estrellas-op input:checked+span{background:var(--tinta);color:var(--amarillo)}
.mis-retos{display:grid;gap:14px;margin-top:20px}
.reto-guardado{background:var(--papel);border:3px solid var(--tinta);border-top:12px solid var(--tc);padding:14px;box-shadow:4px 4px 0 var(--tinta)}
.reto-guardado h3{font-family:var(--f-pixel);font-size:1.05rem;margin:6px 0}
.reto-guardado .meta{display:flex;flex-wrap:wrap;gap:6px}
.reto-guardado p{margin:6px 0}
.reto-guardado .quitar{margin-top:4px}

/* Baquianos */
.baq-cab{background:#7A4A1E;color:#fff;padding:18px;border:4px solid var(--tinta);box-shadow:5px 5px 0 var(--tinta)}
.baq-cab .chip{background:var(--amarillo)}
.baq-cab h1{margin:10px 0 6px}
.baq-cab p{margin:0;font-weight:700}
.pasos-baq{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px;counter-reset:pb}
.pasos-baq li{counter-increment:pb;background:var(--papel);border:3px solid var(--tinta);padding:12px 14px 12px 58px;position:relative;font-weight:600}
.pasos-baq li b{display:block;font-weight:900}
.pasos-baq li::before{content:counter(pb);position:absolute;left:10px;top:12px;width:36px;height:36px;display:grid;place-items:center;background:var(--amarillo);border:3px solid var(--tinta);font-family:var(--f-pixel);font-weight:700}
.juegos-trad{display:grid;gap:12px;margin-top:12px}
.juego-trad{background:var(--papel);border:3px solid var(--tinta);padding:12px 14px}
.juego-trad h3{font-family:var(--f-pixel);font-size:1.05rem;margin:0 0 4px}
.juego-trad p{margin:0 0 10px}
.consejos{margin:12px 0 0;padding-left:1.2em}
.consejos li{margin-bottom:6px;font-weight:600}

/* Reconstrucción del Control */
.final{text-align:center}
.final .control{width:min(300px,82%);margin:10px auto 16px}
.final h2{font-family:var(--f-pixel)}

/* Cuando Terrabit recupera todo su color */
body.terrabit-vivo .terr{--gris:0!important}

/* =========================================================
   6. MOVIMIENTO REDUCIDO
   ========================================================= */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
  .etapa.reproduciendo .actor{animation:none!important;transform:none!important}
  .glitch-titulo::before,.glitch-titulo::after{display:none}
}

  ]

function pixelSVG(mapa, paleta = PALETA, etiqueta = ""){
  const alto = mapa.length, ancho = mapa[0].length;
  let r = "";
  mapa.forEach((fila, y) => [...fila].forEach((c, x) => {
    if (paleta[c]) r += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${paleta[c]}"/>`;
  }));
  const aria = etiqueta ? `role="img" aria-label="${etiqueta}"` : `aria-hidden="true"`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${ancho} ${alto}" shape-rendering="crispEdges" ${aria}>${r}</svg>`;
}
const icono = (n, etiqueta) => `<span class="icono">${pixelSVG(PIX[n], PALETA, etiqueta)}</span>`;

/* Control dividido en 4 fragmentos: 0 Bosque, 1 Jardín, 2 Mar, 3 Montaña */
const ORDEN_TERR = ["bosque", "jardin", "mar", "montana"];
const COLOR_FRAG = ["#2ECC71", "#FF2D8F", "#1E90FF", "#FF8A1F"];
function controlSVG(fragmentos = [true,true,true,true], roto = false, etiqueta = "Control de Terrabit"){
  const mapa = PIX.control, alto = mapa.length, ancho = mapa[0].length;
  const grupos = ["","","",""];
  mapa.forEach((fila, y) => [...fila].forEach((c, x) => {
    if (c === ".") return;
    const f = (y < 6 ? 0 : 2) + (x < 11 ? 0 : 1);
    const tiene = fragmentos[f];
    let color;
    if (c === "K") color = tiene ? "#1F1B2E" : "#8E88A6";
    else if (c === "D") color = tiene ? "#1F1B2E" : "#B9B3CF";
    else if (c === "O") color = tiene ? "#FFFFFF" : "#E9E5F2";
    else color = tiene ? COLOR_FRAG[f] : "#D9D4E7";
    grupos[f] += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${color}"/>`;
  }));
  return `<svg class="control ${roto ? "roto" : ""}" xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 ${ancho+4} ${alto+4}" shape-rendering="crispEdges" role="img" aria-label="${etiqueta}">
    ${grupos.map((g,i) => `<g class="frag f${i}" style="opacity:${fragmentos[i] ? 1 : .55}">${g}</g>`).join("")}
  </svg>`;
}

/* ---------- 7. Confeti pixelado ---------- */
function confeti(){
  if (movimientoReducido()) return;
  const cv = $("#confeti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const colores = ["#FF2D8F","#FF8A1F","#2ECC71","#1E90FF","#FFC93C"];
  const piezas = Array.from({ length: 110 }, () => ({
    x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .4,
    t: 6 + Math.floor(Math.random() * 3) * 3, vy: 2 + Math.random() * 3, vx: -1.5 + Math.random() * 3,
    c: colores[Math.floor(Math.random() * colores.length)]
  }));
  const inicio = performance.now();
  (function paso(ahora){
    ctx.clearRect(0, 0, cv.width, cv.height);
    piezas.forEach(p => { p.y += p.vy; p.x += p.vx; ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x/3)*3, Math.round(p.y/3)*3, p.t, p.t); });
    if (ahora - inicio < 2600) requestAnimationFrame(paso); else ctx.clearRect(0, 0, cv.width, cv.height);
  })(inicio);
}

/* ---------- 8. Sonido (Web Audio API, sin archivos) ---------- */
const Sonido = {
  ctx: null,
  activo: Almacen.leer("cdc_sonido", true),
  obtener(){
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    if (!this.ctx) this.ctx = new C();
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  tono(c, { tipo = "square", f0, f1 = f0, t0, dur, vol = .12 }){
    const o = c.createOscillator(), g = c.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(Math.max(f1, 1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + .05);
  },
  ruido(c, { t0, dur, vol = .08, f0 = 400, f1 = 1600 }){
    const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const s = c.createBufferSource(), fl = c.createBiquadFilter(), g = c.createGain();
    s.buffer = buf; fl.type = "bandpass"; fl.Q.value = 1.2;
    fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(f1, t0 + dur * .5); fl.frequency.exponentialRampToValueAtTime(f0, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + dur * .4); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(fl).connect(g).connect(c.destination); s.start(t0); s.stop(t0 + dur);
  },
  /* Un sonido sencillo por especie */
  efectos: {
    grunido(c, t){ Sonido.tono(c, { tipo:"sawtooth", f0:120, f1:70, t0:t, dur:.4, vol:.1 }); Sonido.tono(c, { tipo:"sawtooth", f0:100, f1:60, t0:t+.5, dur:.5, vol:.08 }); },
    trino(c, t){ for (let i = 0; i < 4; i++) Sonido.tono(c, { tipo:"sine", f0:2200, f1:3400, t0:t + i*.13, dur:.09, vol:.1 }); },
    croac(c, t){ [0, .12, .5, .62].forEach(d => Sonido.tono(c, { tipo:"square", f0:320, f1:200, t0:t + d, dur:.09, vol:.07 })); },
    burbujas(c, t){ for (let i = 0; i < 7; i++) Sonido.tono(c, { tipo:"sine", f0:300 + Math.random()*500, f1:900 + Math.random()*500, t0:t + i*.14, dur:.08, vol:.1 }); },
    viento(c, t){ Sonido.ruido(c, { t0:t, dur:2.2, vol:.09, f0:300, f1:1400 }); },
    zumbido(c, t){
      const o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain();
      o.type = "sawtooth"; o.frequency.value = 190; lfo.frequency.value = 18; lg.gain.value = 14;
      lfo.connect(lg).connect(o.frequency);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(.05, t + .1); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
      o.connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t + 1.5); lfo.stop(t + 1.5);
    },
    magia(c, t){ [523, 659, 784, 1046, 1318].forEach((f, i) => Sonido.tono(c, { tipo:"square", f0:f, t0:t + i*.09, dur:.18, vol:.06 })); },
    campanitas(c, t){ [1318, 1568, 1975, 1568].forEach((f, i) => Sonido.tono(c, { tipo:"triangle", f0:f, t0:t + i*.16, dur:.5, vol:.08 })); }
  },
  sonar(nombre){
    if (!this.activo) return;
    const c = this.obtener(); if (!c || !this.efectos[nombre]) return;
    this.efectos[nombre](c, c.currentTime + .05);
  },
  logro(){ if (!this.activo) return; const c = this.obtener(); if (!c) return; [392, 523, 659, 784].forEach((f, i) => this.tono(c, { tipo:"square", f0:f, t0:c.currentTime + i*.1, dur:.16, vol:.06 })); }
};

/* ---------- 9. Progreso del niño (opcional, solo en este dispositivo) ---------- */
const CLAVE_PROGRESO = "cdc_progreso_v1";
const progresoBase = () => ({ especies:[], fragmentos:[false,false,false,false], juegos:[], juegosPropios:[], secretos:[], retos:[], reconstruido:false });
let progreso = Object.assign(progresoBase(), Almacen.leer(CLAVE_PROGRESO, {}));
const guardarProgreso = () => Almacen.escribir(CLAVE_PROGRESO, progreso);
const descubierta = (id) => progreso.especies.includes(id);
function descubrir(id){
  if (!especie(id) || descubierta(id)) return false;
  progreso.especies.push(id); guardarProgreso(); return true;
}
const fragmentosCompletos = () => progreso.fragmentos.every(Boolean);
function nivelColor(t){
  const i = ORDEN_TERR.indexOf(t);
  if (progreso.fragmentos[i] || fragmentosCompletos()) return 0;
  const todas = DATOS.especies.filter(e => e.territorio === t);
  const vistas = todas.filter(e => descubierta(e.id)).length;
  if (!vistas) return 1;
  return Math.max(0, .75 - .6 * (vistas / todas.length)).toFixed(2);
}

   ================================================================= */
let carrito = Almacen.leer("cdc_carrito", []);
const guardarCarrito = () => Almacen.escribir("cdc_carrito", carrito);
function agregar(id){
  const it = carrito.find(i => i.id === id);
  if (it) it.cantidad++; else carrito.push({ id, cantidad: 1 });
  guardarCarrito(); pintarCarrito();
  avisar(`${PRODUCTOS.find(p => p.id === id).nombre} agregado al carrito`);
}
function cambiar(id, delta){
  const it = carrito.find(i => i.id === id); if (!it) return;
  it.cantidad += delta;
  if (it.cantidad <= 0) carrito = carrito.filter(i => i.id !== id);
  guardarCarrito(); pintarCarrito();
}
function quitar(id){ carrito = carrito.filter(i => i.id !== id); guardarCarrito(); pintarCarrito(); }
const totalCarrito = () => carrito.reduce((s, i) => s + PRODUCTOS.find(p => p.id === i.id).precio * i.cantidad, 0);
function pintarCarrito(){
  const n = carrito.reduce((s, i) => s + i.cantidad, 0);
  const c = $("#cuentaCarrito"); if (c) c.textContent = n;
  const lista = $("#listaCarrito"), pie = $("#pieCarrito");
  if (!carrito.length){
    lista.innerHTML = `<div class="vacio"><img class="pixelado" src="${img("marea")}" alt=""><p><b>Tu carrito está vacío.</b><br>Marea dice que despacio también se llega.</p></div>`;
    pie.innerHTML = `<button class="btn btn--amarillo btn--bloque" type="button" data-cerrar-carrito data-ir="productos">Ver productos</button>`;
    return;
  }
  lista.innerHTML = carrito.map(i => { const p = PRODUCTOS.find(x => x.id === i.id); return `
    <div class="item">
      <div>
        <h3>${esc(p.nombre)}</h3>
        <span class="sub">${pesos.format(p.precio)} c/u</span>
        <div class="cantidad">
          <button type="button" data-menos="${p.id}" aria-label="Quitar una unidad de ${esc(p.nombre)}">−</button>
          <output aria-live="polite" aria-label="Cantidad">${i.cantidad}</output>
          <button type="button" data-mas="${p.id}" aria-label="Agregar una unidad de ${esc(p.nombre)}">+</button>
        </div>
      </div>
      <div style="text-align:right">
        <b>${pesos.format(p.precio * i.cantidad)}</b><br>
        <button class="quitar" type="button" data-quitar="${p.id}">Quitar</button>
      </div>
    </div>`; }).join("");
  pie.innerHTML = `
    <div class="total"><span>Total</span><span>${pesos.format(totalCarrito())}</span></div>
    <!-- PASARELA DE PAGO: aquí puede agregar después un botón de Wompi, Mercado Pago, ePayco o PayU.
         Conéctelo en la función finalizarPago() más abajo. -->
    <button class="btn btn--verde btn--bloque" type="button" id="btnWhatsapp">Finalizar por WhatsApp</button>`;
}
function mensajePedido(){
  const lineas = carrito.map(i => { const p = PRODUCTOS.find(x => x.id === i.id); return `• ${i.cantidad} × ${p.nombre} — ${pesos.format(p.precio * i.cantidad)}`; });
  return `¡Hola! Quiero hacer este pedido de Cambio de Control:\n\n${lineas.join("\n")}\n\nTotal: ${pesos.format(totalCarrito())}\n\nMi nombre:\nCiudad:\nDirección de entrega:`;
}
function finalizarPorWhatsapp(){
  const url = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensajePedido())}`;
  window.open(url, "_blank", "noopener");
}

function finalizarPago(){
  // TODO: crear aquí la orden en la pasarela (Wompi, Mercado Pago, ePayco, PayU)
  // con el total totalCarrito() y el detalle de 'carrito', y redirigir al checkout.
}
function abrirCarrito(){ const c = $("#carrito"); c.classList.add("abierto"); c.setAttribute("aria-hidden", "false"); focoPrevio = document.activeElement; $("[data-cerrar-carrito]", c).focus(); }
function cerrarCarrito(){ const c = $("#carrito"); c.classList.remove("abierto"); c.setAttribute("aria-hidden", "true"); if (focoPrevio) focoPrevio.focus(); }
document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest("[data-agregar]")) agregar(t.closest("[data-agregar]").dataset.agregar);
  else if (t.closest("[data-abrir-carrito]")) abrirCarrito();
  else if (t.closest("[data-cerrar-carrito]")) cerrarCarrito();
  else if (t.closest("[data-mas]")) cambiar(t.closest("[data-mas]").dataset.mas, 1);
  else if (t.closest("[data-menos]")) cambiar(t.closest("[data-menos]").dataset.menos, -1);
  else if (t.closest("[data-quitar]")) quitar(t.closest("[data-quitar]").dataset.quitar);
  else if (t.closest("#btnWhatsapp")) finalizarPorWhatsapp();
});

function resolverCodigo(texto){
  const n = normalizar(texto);
  if (!n) return null;
  for (const [id, t] of Object.entries(DATOS.territorios)){
    if (normalizar(t.guia) === n) return `#/escena-${t.guia.toLowerCase()}`;
    if (normalizar(t.nombre) === n) return `#/mapa`;
    if (normalizar(t.guardian.nombre) === n) return `#/guardian-${id}`;
  }
  for (const e of DATOS.especies) if (normalizar(e.nombre) === n || e.id === n) return `#/escena-${e.id}`;
  if (n === "glitch" || n === "senal rota") return "#/glitch";
  return null;
}

function iniciarEscena(id){
  const e = especie(id), etapa = $("#etapa"); if (!etapa) return;
  const t = terr(e.territorio);
  const play = () => {
    limpiarTemporizadores();
    etapa.classList.remove("terminada", "coloreada", "reproduciendo");
    $("#guiaEscena").classList.remove("visible");
    $("#textoGlobo").textContent = "";
    void etapa.offsetWidth; // reinicia animaciones
    etapa.classList.add("reproduciendo");
    despues(80, () => etapa.classList.add("coloreada"));
    despues(900, () => Sonido.sonar(e.sonido));
    despues(2600, () => {
      $("#guiaEscena").classList.add("visible");
      escribir($("#textoGlobo"), e.frase);
    });
    despues(5800, () => Sonido.sonar(e.sonido));
    despues(7600, () => {
      etapa.classList.add("terminada");
      const otra = document.createElement("button");
      otra.className = "btn btn--blanco btn--chico"; otra.type = "button"; otra.textContent = "↻ Repetir";
      otra.style.cssText = "position:absolute;right:8px;bottom:8px;z-index:7";
      otra.addEventListener("click", () => { otra.remove(); play(); });
      etapa.appendChild(otra);
    });
  };
  $("#btnPlay").addEventListener("click", play);
  if ($(".escena").dataset.nueva === "true"){ despues(300, () => { confeti(); Sonido.logro(); avisar(`¡Descubriste: ${e.nombre}!`); }); }
}
function escribir(el, texto){
  if (movimientoReducido()){ el.textContent = texto; return; }
  let i = 0;
  const paso = () => { el.textContent = texto.slice(0, ++i); if (i < texto.length) despues(32, paso); };
  paso();
}

  </section>`;
}
function pantallaNoEncontrada(){
  return `<section class="pantalla"><h1 tabindex="-1">Señal perdida</h1><p>Esta parte de Terrabit no existe… todavía.</p><a class="btn btn--verde" href="#/mapa">Ir al mapa</a>${vuelveHTML("entrada")}</section>`;
}

/* Barra de navegación del prototipo */
function pintarNav(actual){
  const items = [["entrada","Inicio","casa"],["mapa","Mapa","mapa"],["coleccion","Colección","libro"],["retos","Retos","lapiz"],["glitch","Glitch","glitch"]];
  $("#navApp").innerHTML = items.map(([r, n, ic]) => `<a href="#/${r}" ${actual === r ? 'aria-current="page"' : ""}>${icono(ic)}<span>${n}</span></a>`).join("");
}

/* =================================================================
   ENRUTADOR POR HASH
   ================================================================= */
const TITULOS = { entrada:"Bienvenido a Terrabit", mapa:"Mapa de Terrabit", escena:"Escena", historia:"Historia de la especie", glitch:"Zona oculta Glitch", coleccion:"Mi colección", retos:"Mis retos inventados", baquianos:"Guía para Baquianos", guardian:"Carta Guardián" };
/* Las cartas físicas usan #/escena-anteo, #/escena-chispa, #/escena-marea y #/escena-cima */
const ALIAS = { anteo:"oso", chispa:"colibri", marea:"tortuga", cima:"condor" };

function leerRuta(){
  const h = location.hash.replace(/^#\/?/, "");
  if (!h) return { seccion: "landing" };
  const [base, ...resto] = h.split("-");
  let param = resto.join("-") || null;
  if (param && ALIAS[param]) param = ALIAS[param];
  return { seccion: base, param };
}
function render(){
  limpiarTemporizadores();
  const { seccion, param } = leerRuta();
  if (seccion === "landing" || !TITULOS[seccion]){
    document.body.className = "modo-landing";
    document.title = "Cambio de Control · El siguiente nivel comienza fuera de la pantalla";
    $("#saltar").setAttribute("href", "#contenido-principal");
    if (seccion !== "landing") { location.replace("#/"); }
    return;
  }
  document.body.className = "modo-app" + (fragmentosCompletos() ? " terrabit-vivo" : "");
  const vista = $("#vista");
  const pantallas = {
    entrada: () => pantallaEntrada(),
    mapa: () => pantallaMapa(param),
    escena: () => pantallaEscena(param),
    historia: () => pantallaHistoria(param),
    glitch: () => pantallaGlitch(param),
    coleccion: () => pantallaColeccion(),
    retos: () => pantallaRetos(),
    baquianos: () => pantallaBaquianos(),
    guardian: () => pantallaGuardian(param)
  };
  vista.innerHTML = pantallas[seccion]();
  pintarNav(["escena","historia"].includes(seccion) ? "mapa" : (seccion === "baquianos" || seccion === "guardian" ? "coleccion" : seccion));
  document.title = `${TITULOS[seccion]} · Cambio de Control`;
  window.scrollTo(0, 0);
  const h1 = $("h1", vista); if (h1){ h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
  anunciar(TITULOS[seccion]);
  if (seccion === "escena" && param) iniciarEscena(param);
}
window.addEventListener("hashchange", render);

/* Eventos del prototipo (delegados) */
document.addEventListener("click", e => {
  const t = e.target;
  const terrBtn = t.closest("[data-terr]");
  if (terrBtn){ location.hash = `#/mapa-${terrBtn.dataset.terr}`; return; }
  const espBtn = t.closest("[data-especie]");
  if (espBtn){
    const es = especie(espBtn.dataset.especie);
    const destino = espBtn.closest("[data-destino]")?.dataset.destino || "escena";
    if (descubierta(es.id)) location.hash = `#/${destino}-${es.id}`; else dialogoBloqueada(es);
    return;
  }
  if (t.closest("[data-cerrar-modal]")) { cerrarModal(); return; }
  const frag = t.closest("[data-fragmento]");
  if (frag){ alternarFragmento(Number(frag.dataset.fragmento)); return; }
  const juego = t.closest("button[data-juego]");
  if (juego){
    const id = juego.dataset.juego;
    progreso.juegos = progreso.juegos.includes(id) ? progreso.juegos.filter(j => j !== id) : [...progreso.juegos, id];
    guardarProgreso();
    if (progreso.juegos.includes(id)){ Sonido.logro(); avisar("¡Juego desbloqueado en Terrabit!"); }
    render(); return;
  }
  const br = t.closest("[data-borrar-reto]");
  if (br){ progreso.retos = progreso.retos.filter(r => r.id !== br.dataset.borrarReto); guardarProgreso(); render(); return; }
  if (t.closest("#borrarProgreso")){
    abrirModal(`<h2>¿Borrar la colección?</h2><p>Se borra solo lo guardado en este celular. Tu cuaderno de campo sigue intacto.</p>
      <div class="botonera"><button class="btn btn--fucsia btn--bloque" type="button" id="confirmarBorrar">Sí, borrar</button><button class="btn btn--blanco btn--bloque" type="button" data-cerrar-modal>Mejor no</button></div>`);
    return;
  }
  if (t.closest("#confirmarBorrar")){ progreso = progresoBase(); guardarProgreso(); document.body.classList.remove("terrabit-vivo"); cerrarModal(); render(); avisar("Colección borrada de este celular"); return; }
  if (t.closest("#btnSonido")){ Sonido.activo = !Sonido.activo; Almacen.escribir("cdc_sonido", Sonido.activo); pintarBotonSonido(); if (Sonido.activo) Sonido.sonar("magia"); return; }
});
$("#velo").addEventListener("click", e => { if (e.target.id === "velo") cerrarModal(); });

document.addEventListener("submit", e => {
  const f = e.target;
  e.preventDefault();
  if (f.id === "formCodigo"){
    const destino = resolverCodigo($("#codigo").value);
    const msg = $("#msgCodigo");
    if (destino){ msg.textContent = ""; location.hash = destino; }
    else { msg.textContent = "Ese código no lo reconozco. Revisa tu carta e inténtalo otra vez."; msg.classList.add("error"); }
  }
  if (f.dataset.glitch){
    const id = f.dataset.glitch, g = DATOS.glitch[id], valor = normalizar($("input", f).value);
    const msg = f.nextElementSibling;
    if (g.respuestas.map(normalizar).includes(valor)){
      if (!progreso.secretos.includes(id)){ progreso.secretos.push(id); guardarProgreso(); }
      const zona = $("#zonaGlitch"); zona.classList.remove("glitch-sacudida"); void zona.offsetWidth; zona.classList.add("glitch-sacudida");
      Sonido.sonar("magia"); confeti();
      const caja = $(`#acertijo-${id}`); caja.classList.add("resuelto");
      f.outerHTML = secretoHTML(id); if (msg) msg.remove();
      anunciar(`Zona oculta abierta: ${g.secreto}`);
    } else if (msg){ msg.textContent = "Señal débil… prueba otra respuesta."; }
  }
  if (f.id === "formReto"){
    const nombre = $("#rNombre").value.trim(), que = $("#rQue").value.trim();
    if (!nombre || !que){ $("#msgReto").textContent = "Ponle nombre a tu misión y cuenta qué hay que hacer."; (nombre ? $("#rQue") : $("#rNombre")).focus(); return; }
    progreso.retos.push({
      id: String(Date.now()), nombre, que, quien: $("#rQuien").value.trim(),
      territorio: $("input[name=rTerr]:checked").value, palo: $("input[name=rPalo]:checked").value, nivel: Number($("input[name=rNivel]:checked").value)
    });
    guardarProgreso(); Sonido.logro(); confeti(); render(); avisar("¡Misión guardada! Ahora juégala.");
  }
  if (f.id === "formJuego"){
    const v = $("#juegoPropio").value.trim();
    if (!v){ $("#msgJuego").textContent = "Escriban el nombre del juego."; return; }
    progreso.juegosPropios.push(v); guardarProgreso(); Sonido.logro(); render(); avisar(`«${v}» se sumó a Terrabit`);
  }
});
